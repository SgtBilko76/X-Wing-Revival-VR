plugins {
    id 'com.android.application'
}

// Native code (game, RaptorEngine, SDL2 libs, gl4es) is built from the repository root CMakeLists.txt.
// Game data is NOT packed into the APK: it lives in /sdcard/Android/data/<applicationId>/files.

android {
    namespace 'com.bilko.xwingrevivalvr'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.bilko.xwingrevivalvr'
        minSdk 29
        targetSdk 32
        versionCode 4
        versionName '1.0.2'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', '-DXWR_OPENXR=' + (project.hasProperty('flat') ? 'OFF' : 'ON')
                targets 'main'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
            buildStagingDirectory '../../build-gradle'
        }
    }

    buildFeatures {
        prefab true
    }

    lint {
        // targetSdk 32 is deliberate (Quest sideload, legacy storage behaviour); not a Play Store build.
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // SDL's Java side (SDLActivity etc.) straight from the SDL submodule.
            java.srcDirs += '../../external/SDL/android-project/app/src/main/java'
            // Full APK (tools/build_full_apk.sh): -PgameData=<dir> holding gamedata.idx + gamedata/,
            // unpacked to /sdcard/XWingRevival on first start.
            if( project.hasProperty('gameData') )
                assets.srcDirs += file(project.property('gameData'))
        }
    }

    androidResources {
        // Keep every game data file (the default pattern drops names starting with '_' or '.').
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.62'
}
